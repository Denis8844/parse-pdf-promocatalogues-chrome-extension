<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>keepalive</title>
</head>
<body>
  <!--
    Служебный документ: держит service worker активным во время обработки очереди.
    Chrome может "усыпить" MV3 service worker через ~30 секунд бездействия — тогда
    очередь (живущая в нём) замирает без ошибок. Offscreen-документ — постоянная
    страница: она шлёт сообщение каждые 15 секунд, это событие сбрасывает таймер
    бездействия, и SW продолжает работать, пока идёт обработка.
  -->
  <script src="offscreen.js"></script>
</body>
</html>
